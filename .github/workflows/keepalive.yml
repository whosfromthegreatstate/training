name: Supabase keep-alive

# Free-tier Supabase auto-pauses after ~7 days without API traffic.
# This pings the REST endpoint every 3 days so the workout DB never idles out.
# The key below is the PUBLISHABLE (anon) key — already public in the app's HTML,
# safe to expose; RLS still gates all real access.

on:
  schedule:
    - cron: "17 8 */3 * *"   # every 3rd day at 08:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping PostgREST
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://chscnbrkuwvkdskoyspl.supabase.co/rest/v1/workout_sessions?select=id&limit=1" \
            -H "apikey: sb_publishable_vaBe-idg4DFwsjrcdZxfcw_cYTUjGzC")
          echo "REST status: $code"
          # 200 = alive; anything else fails the run so a failure email flags a pause
          test "$code" = "200"
