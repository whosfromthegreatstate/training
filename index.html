<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1319">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Training</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#0F1319; --surface:#161C25; --surface-2:#1D2530; --line:#28313E;
  --text:#E8EFF7; --muted:#7D8CA1; --dim:#566374;
  --signal:#FFC93C; --cold:#6FD3E8; --sub:#E88B4A; --locked:#3E4856;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;
  line-height:1.4;padding:0 0 env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 80px}

header{padding:calc(env(safe-area-inset-top) + 20px) 0 0}
.context{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);display:flex;justify-content:space-between;align-items:baseline}
.context .phase{color:var(--signal)}
h1{font-size:clamp(30px,8.5vw,42px);line-height:1.02;margin:10px 0 6px;font-weight:800;letter-spacing:-.03em}
.duration{font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}

nav{display:flex;gap:6px;margin:20px 0 8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 auto;min-width:44px;min-height:52px;background:var(--surface);
  border:1px solid transparent;border-radius:10px;color:var(--dim);font-family:var(--mono);
  font-size:11px;font-weight:700;letter-spacing:.1em;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:6px 4px;
  transition:background .12s,color .12s}
nav button .dot{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.45}
nav button[data-rest="1"]{color:var(--locked)}
nav button:hover{background:var(--surface-2)}
nav button[aria-current="true"]{background:var(--signal);color:#0F1319;border-color:var(--signal)}
nav button[aria-current="true"] .dot{opacity:1}
nav button[data-today="1"]:not([aria-current="true"]) .dot{background:var(--signal);opacity:1}
nav button:focus-visible{outline:2px solid var(--cold);outline-offset:2px}

.block{margin-top:26px}
.block-head{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  padding-bottom:8px;border-bottom:1px solid var(--line)}
.block-head .t{color:var(--dim)}

ol.list{list-style:none;margin:0;padding:0}
.ex{border-bottom:1px solid var(--line)}
.ex-btn{width:100%;background:none;border:0;padding:15px 0 14px;display:flex;align-items:flex-start;
  gap:12px;text-align:left;color:inherit;font:inherit;cursor:pointer}
.ex-btn:focus-visible{outline:2px solid var(--cold);outline-offset:-2px;border-radius:4px}
.idx{font-family:var(--mono);font-size:11px;color:var(--dim);padding-top:5px;min-width:16px;font-weight:600}
.ex-main{flex:1;min-width:0}
.ex-name{font-size:17px;font-weight:650;letter-spacing:-.015em;line-height:1.25}
.ex-sub{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.35}
.gear{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--dim);margin-top:5px}
.gear.swap{color:var(--sub)}
.load{font-family:var(--mono);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;text-align:right;padding-top:2px;white-space:nowrap}
.load .unit{font-size:11px;color:var(--dim);display:block;font-weight:500;letter-spacing:.06em}

.tag{display:inline-block;vertical-align:middle;margin-left:7px;font-family:var(--mono);font-size:9px;
  letter-spacing:.12em;border-radius:3px;padding:1px 4px;font-weight:700}
.tag.new{color:var(--cold);border:1px solid var(--cold);opacity:.85}
.tag.swap{color:var(--sub);border:1px solid var(--sub)}

.ex.locked .ex-name,.ex.locked .load,.ex.locked .ex-sub,.ex.locked .gear{color:var(--locked)}

.detail{display:none;padding:0 0 18px 28px}
.ex.open .detail{display:block}
.swapbox{background:rgba(232,139,74,.08);border-left:2px solid var(--sub);padding:10px 12px;
  margin:2px 0 12px;border-radius:0 6px 6px 0}
.swapbox b{color:var(--sub);font-family:var(--mono);font-size:10px;letter-spacing:.12em;
  display:block;margin-bottom:4px}
.swapbox p{margin:0;font-size:13.5px;color:var(--text);line-height:1.5}
.cues{margin:0;padding:0;list-style:none}
.cues li{font-size:14px;color:var(--muted);line-height:1.5;padding:5px 0 5px 14px;position:relative}
.cues li::before{content:"";position:absolute;left:0;top:12px;width:5px;height:1px;background:var(--dim)}
.cues li strong{color:var(--text);font-weight:600}
.demo{display:inline-block;margin-top:10px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--cold);text-decoration:none;border-bottom:1px solid var(--cold);
  padding-bottom:2px}
.demo:focus-visible{outline:2px solid var(--cold);outline-offset:3px}

.rest{margin-top:28px;padding:26px 20px;background:var(--surface);border-radius:14px;border:1px solid var(--line)}
.rest h2{font-size:19px;margin:0 0 8px;font-weight:700;letter-spacing:-.02em}
.rest p{margin:0 0 12px;color:var(--muted);font-size:14px;line-height:1.55}
.rest p:last-child{margin-bottom:0}

.always{margin-top:30px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.always summary{padding:16px 18px;cursor:pointer;font-family:var(--mono);font-size:11px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--signal);list-style:none;
  display:flex;justify-content:space-between;align-items:center}
.always summary::-webkit-details-marker{display:none}
.always summary::after{content:"+";font-size:16px;color:var(--dim)}
.always[open] summary::after{content:"–"}
.always summary:focus-visible{outline:2px solid var(--cold);outline-offset:-2px}
.always .body{padding:0 18px 18px}
.always .body p{font-size:13px;color:var(--muted);margin:0 0 12px;line-height:1.55}

.foot{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);font-family:var(--mono);
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);line-height:1.9}
.foot b{color:var(--muted);font-weight:600}

/* ---- logging ---- */
.logger{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;
  margin:2px 0 14px -28px}
.wrow{display:flex;align-items:stretch;gap:8px;margin-bottom:8px}
.hbtn{flex:0 0 56px;min-height:56px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:12px;color:var(--text);font-size:22px;font-weight:600;cursor:pointer;
  touch-action:manipulation;user-select:none;-webkit-user-select:none}
.hbtn:active{background:var(--signal);color:#0F1319}
.scrubval{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px 0;
  font-family:var(--mono);font-variant-numeric:tabular-nums;touch-action:none;
  user-select:none;-webkit-user-select:none;cursor:ns-resize}
.scrubval .num{font-size:26px;font-weight:800;line-height:1.1}
.scrubval small{font-size:9px;color:var(--dim);letter-spacing:.14em;font-weight:500}
.scrubval.scrubbing{border-color:var(--signal)}
.actrow{display:flex;gap:8px;margin-top:10px}
.logbtn{flex:1;min-height:52px;background:var(--signal);color:#0F1319;border:0;
  border-radius:10px;font-family:var(--mono);font-size:13px;font-weight:800;letter-spacing:.12em;cursor:pointer}
.tbtn{flex:0 0 52px;min-height:52px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:10px;color:var(--cold);font-size:19px;cursor:pointer}
.statslink{display:block;margin-top:12px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--cold);cursor:pointer;text-decoration:none}
.sheetwrap{position:fixed;inset:0;z-index:90;background:rgba(6,9,13,.72);display:none}
.sheetwrap.on{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:82vh;overflow-y:auto;background:var(--surface);
  border-top:1px solid var(--line);border-radius:18px 18px 0 0;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 2px;font-size:19px;letter-spacing:-.02em}
.sheet .sub{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase}
.statrow{display:flex;gap:8px;margin:14px 0}
.stat{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat .n{font-family:var(--mono);font-size:20px;font-weight:800;color:var(--signal)}
.stat .l{font-family:var(--mono);font-size:8.5px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin-top:3px}
.sheet .spark2 svg{width:100%;height:auto;display:block;margin:6px 0 10px}
.sesstable{width:100%;font-family:var(--mono);font-size:11.5px;line-height:1.7;color:var(--muted)}
.sesstable td:first-child{color:var(--text);white-space:nowrap;padding-right:12px;vertical-align:top}
.statrow{flex-wrap:wrap}
.statrow .stat{flex:1 1 30%}
.chip.editing{border-color:var(--signal);color:var(--signal)}
.editlinks{margin-top:8px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.editlinks a{cursor:pointer;margin-right:16px}
.editlinks .del{color:var(--sub)}
.editlinks .can{color:var(--dim)}
.wclock{color:var(--cold)}
.completebtn{display:block;width:100%;margin:26px 0 0;min-height:54px;background:var(--surface);
  border:1px solid var(--signal);border-radius:12px;color:var(--signal);font-family:var(--mono);
  font-size:13px;font-weight:800;letter-spacing:.14em;cursor:pointer}
.completebtn:active{background:var(--signal);color:#0F1319}
.celebr{position:fixed;inset:0;z-index:120;background:rgba(6,9,13,.9);display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;cursor:pointer}
.celebr .big{font-size:64px;font-weight:800;letter-spacing:-.04em;color:var(--signal);
  animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.celebr .sub2{font-family:var(--mono);font-size:13px;color:var(--text);margin-top:10px;line-height:2}
.celebr .spk{position:absolute;font-size:22px;color:var(--signal);animation:spk 1.1s ease-out forwards}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes spk{0%{transform:translateY(0) scale(.4);opacity:0}25%{opacity:1}
  100%{transform:translateY(-90px) scale(1.15);opacity:0}}
.chartlbl{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);margin-top:14px}
.histrows{margin-top:6px}
.histrow{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:11.5px;color:var(--muted);cursor:pointer}
.histrow b{color:var(--text);font-weight:600}
.backlink{display:inline-block;margin-bottom:10px;font-family:var(--mono);font-size:11px;
  color:var(--cold);letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.plates{font-family:var(--mono);font-size:11px;color:var(--cold);margin-top:8px;letter-spacing:.04em}
.plates b{color:var(--muted);cursor:pointer;text-decoration:underline dotted}
.ghost{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:6px}
.e1rm{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:3px}
.e1rm b{color:var(--signal)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:8px;padding:7px 10px;color:var(--text);cursor:pointer}
.chip.pend{border-style:dashed;color:var(--muted)}
.chip .x{color:var(--sub);margin-left:7px;font-weight:700}
.spark{margin-top:10px}
.spark svg{width:100%;height:36px;display:block}
.histlist{margin-top:8px;font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.8}
.histlist b{color:var(--text)}
.timerbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface-2);
  border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  display:none;align-items:center;justify-content:space-between;gap:10px}
.timerbar.on{display:flex}
.timerbar.done{background:var(--signal);color:#0F1319}
.timerbar .t{font-family:var(--mono);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.timerbar .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.timerbar.done .lbl{color:#0F1319}
.timerbar button{min-height:40px;background:var(--surface);border:1px solid var(--line);border-radius:8px;
  color:var(--text);font-family:var(--mono);font-size:12px;font-weight:700;padding:0 12px;cursor:pointer}
.timerbar.done button{background:#0F1319;color:var(--signal);border-color:#0F1319}
.authrow{margin-top:10px;font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.06em}
.authrow a{color:var(--cold);cursor:pointer;text-decoration:underline}
.authrow input{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;color:var(--text);
  font:inherit;padding:8px 10px;margin:6px 6px 0 0;width:190px}
.authrow button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;color:var(--text);
  font:inherit;padding:8px 12px;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="context">
      <span id="ctx-date"></span><span class="phase" id="ctx-phase"></span>
    </div>
    <h1 id="title"></h1>
    <div class="duration" id="duration"></div>
  </header>
  <nav id="nav" aria-label="Rotation day"></nav>
  <main id="content"></main>

  <details class="always">
    <summary>Daily mobility · 10 min · separate from training</summary>
    <div class="body">
      <p>Not part of a session. Morning or evening, every day including rest days. Gates the handstand, the squat, the overhead press, and snowboard rotation — four goals, ten minutes.</p>
      <ol class="list" id="mobility"></ol>
    </div>
  </details>

  <details class="always" style="margin-top:14px">
    <summary>Your gym · what you have and what's missing</summary>
    <div class="body" id="gearlist"></div>
  </details>

  <div class="foot" id="foot"></div>
</div>

<script>
const START = new Date(2026,7,24);
const ICELAND_OUT = new Date(2026,7,9);
const ICELAND_BACK = new Date(2026,7,22);
const ANCHOR_DATE = new Date(2026,6,19);   // Sun 19 Jul 2026
const ANCHOR_POS  = 5;                     // Deadlift + Posterior

const yt = q => "https://www.youtube.com/results?search_query="+encodeURIComponent(q);

/* ============================================================
   OPENER
   ============================================================ */
const OPENER = { label:"Opener", time:"10 min", items:[
  {n:"Wrist + shoulder prep", load:"4", unit:"min", new:true, gear:"Bands",
   sub:"Never skip. Wrist tendonitis is the #1 thing that ends handstand training.",
   cues:["Wrist circles, prayer and reverse-prayer stretch","Knuckle push-ups, palm rocks front to back","Band pass-throughs for the shoulders","<strong>Every session.</strong> No exceptions"],
   demo:yt("wrist prep routine handstand training")},
  {n:"Handstand practice", load:"6", unit:"min", new:true, gear:"Wall",
   sub:"Fresh, before anything else. Chest-to-wall — the honest version.",
   cues:["Belly to wall, hands <strong>6 inches</strong> from the base","Arms locked, shoulders shrugged to your ears","<strong>Ribs down, glutes squeezed.</strong> Arching = banana with the wall behind you","Finger-pressure pulses 3×20","Your wall holds have been back-to-wall. Expect 15–30s and expect it to humble you","Target: 3×60s chest-to-wall by October"],
   demo:yt("chest to wall handstand hold technique")}
]};

/* ============================================================
   DAYS
   gear = equipment needed.  swap = substitution using what you own.
   ============================================================ */
const DAYS = {
1:{name:"Squat + Jump", dur:"~52 min", blocks:[
  {label:"Jump", time:"18 min", items:[
    {n:"Rim jumps", load:"8–10", unit:"attempts", gear:"Hoop, ball",
     sub:"Max effort, fully fresh, long rest. Skill work.",
     cues:["Full approach every rep — you're training the approach as much as the jump","<strong>Penultimate step long and low</strong> — that's where most people leak power","Arms drive from behind the hips, accelerating up as feet leave the floor","Film one set a week at 240fps, side angle"],
     demo:yt("basketball dunk approach two foot takeoff technique")},
    {n:"Drop jumps", load:"4×3", unit:"", new:true, gear:"Box 8–24\"",
     swap:"No plyo box yet — <strong>use your bench</strong>. A flat bench is ~17–18\", which is dead centre of the drop-jump range. Land on rubber matting, not bare concrete. Half the sets (2×3) until you have proper mats.",
     sub:"Low box. Minimal ground contact. The floor is lava.",
     cues:["<strong>Heel-slap test:</strong> hear your heels hit → box is too high","Pick the height where rebound stays within 1–2\" of your standing vertical","Land forefoot-to-midfoot, toes pulled up before contact","Quarter squat at most. Stiff bounce, ankles doing the work","Rebound drops within a set → <strong>stop the set</strong>","Drop jump ≠ depth jump. You're training reactivity first"],
     demo:"https://www.just-fly-sports.com/depth-jump-guide/"}
  ]},
  {label:"Strength", time:"27 min", items:[
    {n:"Squat", load:"5×3", unit:"82–87%", gear:"SSB + rack",
     swap:"No safety squat bar yet — <strong>use the Yukon bar</strong>. It's a buffalo-style bar with a 6\" bend; more shoulder comfort than a straight bar, though it won't fix your bracing. Test Yukon vs straight bar one session each, filmed from the side, and use whichever holds depth and torso angle longer.",
     sub:"The strength driver — and more trunk demand than a back squat, not less.",
     cues:["Full depth: hip crease below the top of the knee","Controlled down, <strong>explode up</strong>","Target 305 back-squat equivalent. Milestones: 240 → 275 → 305","An SSB constantly tries to fold you forward — that's the point. It trains the thing that fails","Back squat itself: every 4th week, 3×5 at 60–70%, pattern practice only"],
     demo:yt("safety squat bar technique upright torso")},
    {n:"Bulgarian split squat", load:"3×8", unit:"per leg", gear:"Bench, DBs",
     sub:"Quad-dominant, low spinal load, closest to a jump.",
     cues:["Rear foot on the bench, front shin roughly vertical","Slow eccentric","Note left/right differences — they matter","35 lb DBs will cap this soon. Loadable handles fix it"],
     demo:yt("bulgarian split squat form technique")},
    {n:"Belt squat", load:"3×10", unit:"heavy", gear:"Cable + dip belt",
     swap:"You don't have a leg press. <strong>Better option:</strong> low pulley on your cable machine + a dip belt, standing on two blocks. Zero spinal compression — arguably better than a leg press given T6-8. <em>Until the dip belt arrives:</em> add a 4th set of Bulgarian split squats instead.",
     sub:"Loads the legs with the trunk removed. The clean read on your leg strength.",
     cues:["Your trunk has always failed first. This is the lift that tells the truth","Stand on blocks so the plates clear the floor","Full range, no lockout slam"],
     demo:yt("cable belt squat home gym setup")},
    {n:"Knee extension", load:"3×12", unit:"50–70", gear:"Cable + ankle strap",
     swap:"The bench attachment broke — <strong>cable ankle strap on the low pulley</strong> is the fix ($20, top of the buy list). Until it arrives: <strong>band around the ankle</strong>, anchored low behind you. Either way put the anchor <strong>directly under the knee</strong> — anchored far behind you, the cable runs parallel to the shin at lockout and torque dies exactly where you need it. A band partly fixes this by itself: tension climbs as you extend.",
     sub:"Permanent. Knee pain returned when these stopped — this is injury-prevention work, not filler.",
     cues:["Full extension, <strong>2s pause at the top</strong> — the lockout is the part that matters","251 sets logged since 2017, last at 50×12. Build back, then add","Each leg separately. Note any left/right gap"],
     demo:yt("cable ankle strap knee extension seated")},
    {n:"Seated calf raise", load:"3×15", unit:"", new:true, gear:"Bench + plates",
     sub:"Soleus. Never trained. Primary ankle-stiffness contributor in a jump.",
     cues:["Sit on the bench, plates or a loaded bar across your knees, balls of feet on a plate","<strong>Seated</strong> hits soleus; standing hits gastroc. You need seated","Full stretch at the bottom, pause at the top","A soft ankle is a hard ceiling on your vertical"],
     demo:yt("seated calf raise soleus technique home gym")}
  ]}
]},

2:{name:"Bench + Pull", dur:"~52 min", blocks:[
  {label:"Press", time:"20 min", items:[
    {n:"Bench press", load:"5×3", unit:"175–185", gear:"Barbell, bench",
     sub:"Current 1RM ~210. Target 275.",
     cues:["Heavy triples move a max. Your 3×7 work is hypertrophy, not strength","+5 lb/week until it stalls, then +3, then add a rep","Milestones: 235 (mid-2027) → 255 (2028) → 275 (2029)","The Yukon's 6\" bend gives a deeper ROM here — a good use for it"],
     demo:yt("bench press setup technique arch leg drive")},
    {n:"Overhead press", load:"3×6", unit:"", gear:"Barbell, rack",
     sub:"Your free T-spine diagnostic. Check it every session.",
     cues:["<strong>Watch for rib flare and low-back arch</strong> as the bar goes overhead","If you have to arch to lock out, your thoracic extension isn't there — and neither is your handstand","The fact that it's humbling is the information"],
     demo:yt("strict overhead press technique ribs down")}

function buildNav(){

  ORDER.forEach(d=>{

    b.innerHTML = SHORT[d]+'<span class="dot"></span>';
    b.setAttribute("aria-current", d===selected?"true":"false");
    if(!DAYS[d]) b.dataset.rest="1";
    if(d===today) b.dataset.today="1";
    b.setAttribute("aria-label",(DAYS[d]?DAYS[d].name:"Rest day")+(d===today?" — today":""));

    nav.appendChild(b);
  });

function exerciseNode(item, idx){
  const locked = item.week && weekNum>0 && weekNum<item.week;
  const li=document.createElement("li");
  li.className="ex"+(locked?" locked":"");
  const btn=document.createElement("button");
  btn.className="ex-btn"; btn.setAttribute("aria-expanded","false");

  const subline = locked
    ? "Unlocks week "+item.week+" — tendons adapt slower than muscle"
    : (item.sub||"");

  let tags="";
  if(!locked && item.new) tags+='<span class="tag new">NEW</span>';
  if(!locked && item.swap) tags+='<span class="tag swap">SUB</span>';

  btn.innerHTML =
    '<span class="idx">'+(idx!=null?String(idx).padStart(2,"0"):"")+'</span>'+
    '<span class="ex-main">'+
      '<span class="ex-name">'+item.n+tags+'</span>'+
      (subline?'<span class="ex-sub">'+subline+'</span>':'')+
      (item.gear?'<span class="gear'+(item.swap?' swap':'')+'">'+
        (item.swap?'✕ ':'▸ ')+item.gear+(item.swap?' — using a substitute':'')+'</span>':'')+
    '</span>'+
    '<span class="load">'+(locked?"—":item.load)+
      (item.unit&&!locked?'<span class="unit">'+item.unit+'</span>':'')+'</span>';

  const detail=document.createElement("div");
  detail.className="detail";
  if(item.swap){
    const sb=document.createElement("div");
    sb.className="swapbox";
    sb.innerHTML='<b>Do this instead</b><p>'+item.swap+'</p>';
    detail.appendChild(sb);
  }
  if(item.cues){
    const ul=document.createElement("ul"); ul.className="cues";
    item.cues.forEach(c=>{const l=document.createElement("li");l.innerHTML=c;ul.appendChild(l);});
    detail.appendChild(ul);
  }
  if(item.demo){
    const a=document.createElement("a");
    a.className="demo"; a.href=item.demo; a.target="_blank"; a.rel="noopener";
    a.textContent="Watch demo"; detail.appendChild(a);
  }

  btn.onclick=()=>{
    const open=li.classList.toggle("open");
    btn.setAttribute("aria-expanded",open?"true":"false");
    if(open && window.WT) WT.opened(item);
    if(window.WT) open ? WT.uiOpen() : WT.uiClose();
  };
  li.appendChild(btn); li.appendChild(detail);
  if(idx!=null && !locked && window.WT) WT.decorate(detail,item);
  return li;
}

function blockNode(block, counter){
  const wrap=document.createElement("section");
  wrap.className="block";
  wrap.innerHTML='<div class="block-head"><span>'+block.label+'</span><span class="t">'+(block.time||"")+'</span></div>';
  const ol=document.createElement("ol"); ol.className="list";
  block.items.forEach(it=>ol.appendChild(exerciseNode(it,++counter.v)));
  wrap.appendChild(ol);
  return wrap;
}

  el("ctx-phase").textContent=phase;

  if(!day){
    const r=REST[selected]||REST[7];

    content.appendChild(box);
  } else {
    el("title").textContent=day.name;
    el("duration").textContent=day.dur+(day.note?" · "+day.note:"");
    const c={v:0};
    content.appendChild(blockNode(OPENER,c));
    day.blocks.forEach(b=>content.appendChild(blockNode(b,c)));
  }

  const mob=el("mobility");
  if(!mob.hasChildNodes()) MOBILITY.forEach(m=>mob.appendChild(exerciseNode(m,null)));

      '</ul>'+
      '<p style="margin-top:14px;color:var(--muted);font-size:12.5px">'+GEAR.broken.join("<br>")+'</p>';
  }

  el("foot").innerHTML =
    "<b>Log sets by tapping an exercise.</b> Milestones in Asana.<br>"+
    "Never jump tired · Ribs down · Sleep 7.5+<br>"+
    "Hold 170 lb · Protein 170–190 g · Creatine 5 g"+
    '<div class="authrow" id="authrow"></div>';
  if(window.WT) WT.authRow();
}
render();

  if(!session || !navigator.onLine || syncing) { authRow(); return; }
  syncing = true;
  try { await syncBody(); } finally { syncing = false; }
}
async function syncBody(){
  const pending = local.filter(s=>!s.synced);
  if(pending.length){
    const rows = pending.map(({synced,...r})=>r);
    const { error } = await sb.from(TABLE).upsert(rows, { onConflict:"id" });
    if(!error) pending.forEach(s=>s.synced=true);
  }
  for(const id of [...dels]){
    const { error } = await sb.from(TABLE).delete().eq("id", id);
    if(!error) dels = dels.filter(x=>x!==id);
  }
  for(const row of [...sessq]){
    const { error } = await sb.from("workout_sessions").upsert(row, { onConflict:"id" });
    if(!error) sessq = sessq.filter(x=>x!==row);
  }
  // trim local to last 90 days
  const cutoff = new Date(Date.now()-90*864e5).toISOString().slice(0,10);
  local = local.filter(s=>s.session_date>=cutoff);
  saveLocal(); authRow();
  Object.values(refreshers).forEach(f=>{ try{f();}catch{} });
}

async function fetchHist(name){
  if(!session || !navigator.onLine) return;
  const names = [name, ...(ALIAS[name]||[])];
  const { data, error } = await sb.from(TABLE)
    .select("id,logged_at,session_date,exercise,weight_lb,reps")
    .in("exercise", names).order("logged_at",{ascending:false}).limit(1000);
  if(error || !data) return;
  const sane = data.filter(r=>r.weight_lb==null || r.weight_lb<600);  // typo guard
  const sessions = {};
  sane.forEach(r=>{ (sessions[r.session_date] ??= []).push(r); });
  const days = Object.keys(sessions).sort().reverse();
  const spark = days.slice(0,60).map(d=>{
    const best = Math.max(...sessions[d].map(r=>e1rm(r.weight_lb,r.reps)||0));
    const vol = sessions[d].reduce((a,r)=>a+(r.weight_lb||0)*(r.reps||0),0);
    const maxw = Math.max(0,...sessions[d].map(r=>r.weight_lb||0));
    return { d, e1: best, vol: Math.round(vol), maxw };
  }).reverse();
  let best = {e1:0,d:null,w:null,r:null};
  sane.forEach(r=>{ const e=e1rm(r.weight_lb,r.reps); if(e && e>best.e1) best={e1:e,d:r.session_date,w:r.weight_lb,r:r.reps}; });
  const t = todayISO();
  const lastDay = days.find(d=>d<t);
  hist[name] = { at: Date.now(), spark, best,
    last: lastDay ? { d:lastDay, sets: sessions[lastDay].slice().reverse().map(r=>[r.weight_lb,r.reps]) } : null,
    recent: days.map(d=>({ d, sets: sessions[d].slice().reverse().map(r=>[r.weight_lb,r.reps]) })) };
  LS.set("wt_hist", hist);
}

/* ---------- math + plates ---------- */
const e1rm = (w,r) => (w==null||!r) ? null : Math.round(w*(1+r/30));
function plates(total){
  let side = (total - barW)/2;
  if(side < 0) return "below bar weight";
  const out=[]; for(const p of [45,35,25,10,5,2.5]){ while(side>=p-0.01){ out.push(p); side-=p; } }
  return out.length ? out.join(" + ") : "empty bar";
}

/* ---------- timer ---------- */
const tb = document.getElementById("timerbar");
let tLeft=0, tInt=null;
function startTimer(sec,label){
  clearInterval(tInt); tLeft=sec; tb.classList.add("on"); tb.classList.remove("done");
  document.getElementById("timer-lbl").textContent = "Rest · "+label;
  const draw=()=>{ document.getElementById("timer-t").textContent =
    Math.floor(Math.max(tLeft,0)/60)+":"+String(Math.max(tLeft,0)%60).padStart(2,"0"); };
  draw();
  tInt=setInterval(()=>{ tLeft--; draw();
    if(tLeft<=0){ clearInterval(tInt); tb.classList.add("done");
      document.getElementById("timer-lbl").textContent="GO";
      if(navigator.vibrate) navigator.vibrate([200,100,200]); }
  },1000);
}
document.getElementById("timer-add").onclick=()=>{ tLeft+=30; tb.classList.remove("done"); };
document.getElementById("timer-x").onclick=()=>{ clearInterval(tInt); tb.classList.remove("on"); };

/* ---------- logger UI ---------- */
const todaySets = name => local.filter(s=>s.exercise===name && s.session_date===todayISO());
const refreshers = {};   // exercise name -> refresh fn of the currently rendered logger

function decorate(detail, item){
  const name=item.n, box=document.createElement("div");
  box.className="logger";
  const h=hist[name];
  const last = todaySets(name).at(-1) || (h?.last ? {weight_lb:h.last.sets.at(-1)[0], reps:h.last.sets.at(-1)[1]} : null);
  let w = last?.weight_lb ?? 0, r = last?.reps ?? 5, touched = false;

  box.innerHTML =
    '<div class="wrow"><button class="hbtn" data-k="w" data-d="-1">−</button>'+
      '<div class="scrubval" data-k="w"><span class="num wv"></span><small>LB · TAP ±5 · HOLD ±2½ · DRAG</small></div>'+
      '<button class="hbtn" data-k="w" data-d="1">+</button></div>'+
    '<div class="wrow"><button class="hbtn" data-k="r" data-d="-1">−</button>'+
      '<div class="scrubval" data-k="r"><span class="num rv"></span><small>REPS</small></div>'+
      '<button class="hbtn" data-k="r" data-d="1">+</button></div>'+
    '<div class="plates"></div><div class="e1rm"></div><div class="ghost"></div>'+
    '<div class="actrow"><button class="logbtn">LOG SET</button><button class="tbtn" title="rest timer">⏱</button></div>'+
    '<div class="chips"></div><div class="editlinks" style="display:none">'+
    '<a class="del">delete set</a><a class="can">cancel</a></div>'+
    '<a class="statslink">Stats + history ›</a>';
  let editing = null;   // id of today's set being edited

  const q=s=>box.querySelector(s);
  const refresh=()=>{
    if(!touched && w===0 && !todaySets(name).length && hist[name]?.last){
      const ls=hist[name].last.sets.at(-1); w=ls[0]??0; r=ls[1]??r;
    }
    q(".wv").textContent = w%1 ? w.toFixed(1) : w;
    q(".rv").textContent = r;
    q(".plates").innerHTML = BARBELL.has(name)&&w>0 ?
      'per side: '+plates(w)+' · <b>bar '+barW+'</b>' : "";
    const e=e1rm(w||null,r), hb=hist[name]?.best;
    q(".e1rm").innerHTML = (e?('this set e1RM <b>'+e+'</b>'):'') +
      (hb?.e1 ? (e?' · ':'')+'best '+hb.e1+' ('+hb.d+')' : '');
    const hl=hist[name]?.last;
    q(".ghost").textContent = hl ? "last · "+hl.d+" · "+hl.sets.map(s=>(s[0]??"bw")+"×"+s[1]).join("  ") : "";
    q(".logbtn").textContent = editing ? "UPDATE SET" : "LOG SET";
    q(".editlinks").style.display = editing ? "block" : "none";
    const chips=q(".chips"); chips.innerHTML="";
    todaySets(name).forEach(s=>{
      const c=document.createElement("span");
      c.className="chip"+(s.synced?"":" pend")+(editing===s.id?" editing":"");
      c.textContent=(s.weight_lb??"bw")+"×"+s.reps;
      c.onclick=()=>{   // tap a set to edit it; tap again to deselect
        if(editing===s.id){ editing=null; }
        else { editing=s.id; touched=true; w=s.weight_lb??0; r=s.reps; }
        refresh(); };
      chips.appendChild(c);
    });
    WT.completeBar && WT.completeBar();
  };

  const adjust=(k,steps,fine)=>{ touched=true;
    if(k==="r") r=Math.min(100,Math.max(1, r+steps));
    else { const inc=fine?2.5:5; w=Math.max(0, Math.round((w+steps*inc)*2)/2); }
    refresh();
  };
  /* tap = one coarse step; hold = accelerating fine steps */
  box.querySelectorAll(".hbtn").forEach(b=>{
    const k=b.dataset.k, d=+b.dataset.d;
    let t=null, held=false;
    const loop=(delay)=>{ t=setTimeout(()=>{ held=true; adjust(k,d,true);
      loop(Math.max(70, delay*0.82)); }, delay); };
    b.onpointerdown=e=>{ e.preventDefault(); held=false; loop(420); b.setPointerCapture(e.pointerId); };
    const end=()=>{ clearTimeout(t); t=null; };
    b.onpointerup=e=>{ end(); if(!held) adjust(k,d,false); };
    b.onpointercancel=end; b.oncontextmenu=e=>e.preventDefault();
  });
  /* drag the value up/down to scrub in fine steps */
  box.querySelectorAll(".scrubval").forEach(v=>{
    const k=v.dataset.k; let sy=null;
    v.onpointerdown=e=>{ sy=e.clientY; v.classList.add("scrubbing"); v.setPointerCapture(e.pointerId); };
    v.onpointermove=e=>{ if(sy==null) return;
      const steps=Math.trunc((sy-e.clientY)/14);
      if(steps){ adjust(k,steps,true); sy=e.clientY; if(navigator.vibrate) navigator.vibrate(3); } };
    v.onpointerup=v.onpointercancel=()=>{ sy=null; v.classList.remove("scrubbing"); };
  });
  box.querySelector(".plates").onclick=e=>{
    if(e.target.tagName==="B"){ barW = barW===45?55:45; LS.set("wt_bar",barW); refresh(); } };
  box.querySelector(".tbtn").onclick=()=>startTimer(/5×3|4×5/.test(item.load||"")?180:90, name);
  box.querySelector(".statslink").onclick=()=>openSheet(name);
  box.querySelector(".editlinks .del").onclick=()=>{
    const s=local.find(x=>x.id===editing); if(!s) { editing=null; refresh(); return; }
    local=local.filter(x=>x.id!==s.id); if(s.synced) dels.push(s.id);
    editing=null; saveLocal(); sync(); refresh(); };
  box.querySelector(".editlinks .can").onclick=()=>{ editing=null; refresh(); };
  box.querySelector(".logbtn").onclick=()=>{
    if(editing){
      const s=local.find(x=>x.id===editing);
      if(s){ s.weight_lb=w||null; s.reps=r; s.synced=false; }
      editing=null; saveLocal(); sync(); refresh(); return;
    }
    if(!LS.get("wt_sess"))
      LS.set("wt_sess", { id:crypto.randomUUID(), start:new Date().toISOString(), d:todayISO() });
    local.push({ id:crypto.randomUUID(), logged_at:new Date().toISOString(),
      session_date:todayISO(), exercise:name, weight_lb:w||null, reps:r,
      source:"app", synced:false });
    saveLocal(); sync(); refresh();
    startTimer(/5×3|4×5/.test(item.load||"")?180:90, name);
  };
  refresh();
  refreshers[name] = refresh;
  detail.insertBefore(box, detail.firstChild);
}

function opened(item){
  const h=hist[item.n];
  if(!h || Date.now()-h.at > 6*3600e3) fetchHist(item.n).then(()=>refreshers[item.n]?.());
}

/* ---------- workout clock + complete ---------- */
const fmtDur = s => s>=3600 ? Math.floor(s/3600)+"h "+Math.floor(s%3600/60)+"m" : Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");
/* A workout runs from its first logged set until COMPLETE; the next set after
   completing starts a new workout — two-a-days are two records. */
const curSess = () => {
  const s=LS.get("wt_sess", null);
  if(s && s.d!==todayISO()){   // stale from a past day: age it out
    localStorage.removeItem("wt_sess"); return null; }
  return s;
};

setInterval(()=>{
  let c=document.getElementById("wclock");
  const s=curSess();
  if(!s){ c&&c.remove(); return; }
  if(!c){ const cd=document.getElementById("ctx-date");
    if(!cd || !/DAY/.test(cd.textContent)) return;
    c=document.createElement("span"); c.id="wclock"; c.className="wclock";
    cd.appendChild(c); }
  c.textContent=" · "+fmtDur((Date.now()-new Date(s.start))/1000);
},1000);

function completeBar(){
  let b=document.getElementById("completebtn");
  if(!curSess()){ b&&b.remove(); return; }
  if(!b){
    b=document.createElement("button"); b.id="completebtn"; b.className="completebtn";
    b.textContent="COMPLETE WORKOUT";
    const foot=document.querySelector(".foot");
    foot.parentNode.insertBefore(b, foot);
    b.onclick=completeWorkout;
  }
}

async function completeWorkout(){
  const s=curSess(); if(!s) return;
  const sets=local.filter(x=>x.session_date===todayISO() && x.logged_at>=s.start);
  const dur=Math.max(60, Math.round((Date.now()-new Date(s.start))/1000));
  const vol=Math.round(sets.reduce((a,x)=>a+(x.weight_lb||0)*x.reps,0));
  const row={ id:s.id, session_date:todayISO(), started_at:s.start,
    completed_at:new Date().toISOString(), duration_sec:dur,
    sets_count:sets.length, volume_lb:vol, source:"app" };
  localStorage.removeItem("wt_sess");
  let num=null;
  if(session && navigator.onLine){
    const { error } = await sb.from("workout_sessions").upsert(row, { onConflict:"id" });
    if(!error){ const { count } = await sb.from("workout_sessions").select("*",{count:"exact",head:true}); num=count; }
    else { sessq.push(row); saveLocal(); }
  } else { sessq.push(row); saveLocal(); }
  completeBar();
  celebrate(num, dur, vol, sets.length);
}

function celebrate(num, dur, vol, n){
  const o=document.createElement("div"); o.className="celebr";
  o.innerHTML =
    Array.from({length:7},(_,i)=>'<span class="spk" style="left:'+(12+i*12)+'%;top:'+(38+(i%3)*14)+'%;animation-delay:'+(i*0.09)+'s">✦</span>').join("")+
    '<div class="big">#'+(num??"—")+'</div>'+
    '<div class="sub2">WORKOUT COMPLETE<br>'+fmtDur(dur)+' · '+n+' set'+(n===1?'':'s')+' · '+vol.toLocaleString()+' lb moved</div>';
  o.onclick=()=>{ if(o.isConnected){ o.remove(); uiClose(); } };
  document.body.appendChild(o);
  uiOpen();
  if(navigator.vibrate) navigator.vibrate([100,60,100,60,200]);
  setTimeout(()=>{ if(o.isConnected){ o.remove(); uiClose(); } }, 6000);
}

/* ---------- global history ---------- */
async function openHist(){
  const sh=document.getElementById("sheet");
  sh.innerHTML='<h3>History</h3><div class="sub">loading…</div>';
  if(!sw2.classList.contains("on")){ sw2.classList.add("on"); uiOpen(); }
  if(!session || !navigator.onLine){ sh.innerHTML='<h3>History</h3><div class="sub">needs connection + sign-in</div>'; return; }
  const { data, count } = await sb.from("workout_sessions")
    .select("*",{count:"exact"}).order("session_date",{ascending:false}).limit(400);
  if(!data){ sh.innerHTML='<h3>History</h3><div class="sub">failed to load</div>'; return; }
  sh.innerHTML =
    '<h3>History</h3><div class="sub">'+count+' workouts · since '+(data.at(-1)?.session_date.slice(0,4)||"")+'</div>'+
    '<div class="histrows">'+data.map((s,i)=>
      '<div class="histrow" data-d="'+s.session_date+'"><span><b>#'+(count-i)+'</b> '+s.session_date+'</span>'+
      '<span>'+(s.duration_sec?fmtDur(s.duration_sec):"—")+' · '+(s.sets_count||0)+' sets · '+
      Math.round(s.volume_lb||0).toLocaleString()+'</span></div>').join("")+'</div>';
  sh.querySelectorAll(".histrow").forEach(r=>r.onclick=()=>openDay(r.dataset.d));
}

async function openDay(d){
  const sh=document.getElementById("sheet");
  sh.innerHTML='<h3>'+d+'</h3><div class="sub">loading…</div>';
  const { data } = await sb.from(TABLE).select("exercise,weight_lb,reps,logged_at")
    .eq("session_date", d).order("logged_at");
  const by={};
  (data||[]).forEach(r=>{ (by[r.exercise] ??= []).push((r.weight_lb??"bw")+"×"+r.reps); });
  sh.innerHTML='<a class="backlink">‹ all workouts</a><h3>'+d+'</h3>'+
    '<table class="sesstable">'+Object.entries(by).map(([ex,sets])=>
      '<tr><td>'+ex+'</td><td>'+sets.join("  ")+'</td></tr>').join("")+'</table>';
  sh.querySelector(".backlink").onclick=openHist;
}

/* ---------- stats sheet ---------- */
const sw2=document.createElement("div");
sw2.className="sheetwrap"; sw2.innerHTML='<div class="sheet" id="sheet"></div>';
document.body.appendChild(sw2);
sw2.onclick=e=>{ if(e.target===sw2){ sw2.classList.remove("on"); uiClose(); } };

/* ---------- back button closes UI layers instead of the app ---------- */
function uiOpen(){ history.pushState({wt:1}, ""); }
function uiClose(){ if(history.state && history.state.wt) history.back(); }
window.addEventListener("popstate", ()=>{
  const cel=document.querySelector(".celebr");
  if(cel){ cel.remove(); return; }
  if(sw2.classList.contains("on")){ sw2.classList.remove("on"); return; }
  document.querySelectorAll(".ex.open").forEach(li=>{
    li.classList.remove("open");
    li.querySelector(".ex-btn")?.setAttribute("aria-expanded","false");
  });
});

function openSheet(name, isRetry){
  const h=hist[name], sh=document.getElementById("sheet");
  const tSets=todaySets(name);
  const todayBest=Math.max(0,...tSets.map(s=>e1rm(s.weight_lb,s.reps)||0));
  const totalSets=(h?.recent||[]).reduce((a,s)=>a+s.sets.length,0);
  const todayVol=Math.round(tSets.reduce((a,s)=>a+(s.weight_lb||0)*s.reps,0));
  /* time-scaled line chart with subtle labeled reference lines */
  const lineSvg=(pts,color)=>{
    const W=320,H=86,PL=4,PR=30,PT=8,PB=15;
    const t0=pts[0].t, t1=pts[pts.length-1].t, tr=(t1-t0)||1;
    const vs=pts.map(p=>p.v), mn=Math.min(...vs), mx=Math.max(...vs), rng=(mx-mn)||1;
    const X=t=>PL+(t-t0)/tr*(W-PL-PR), Y=v=>PT+(1-(v-mn)/rng)*(H-PT-PB);
    const line=pts.map(p=>X(p.t).toFixed(1)+","+Y(p.v).toFixed(1)).join(" ");
    const refs=[...new Set([mx,(mn+mx)/2,mn].map(Math.round))].map(v=>
      '<line x1="'+PL+'" y1="'+Y(v).toFixed(1)+'" x2="'+(W-PR)+'" y2="'+Y(v).toFixed(1)+'" stroke="#28313E" stroke-dasharray="2 4" stroke-width="0.7"/>'+
      '<text x="'+(W-PR+3)+'" y="'+(Y(v)+2.5).toFixed(1)+'" font-size="7.5" fill="#566374" font-family="ui-monospace,monospace">'+v.toLocaleString()+'</text>').join("");
    const fmt=t=>{const d=new Date(t); return (d.getMonth()+1)+"/"+String(d.getFullYear()).slice(2);};
    const xts=[...new Set([t0,(t0+t1)/2,t1].map(fmt))];
    const xt=xts.map((lab,i)=>{const t=[t0,(t0+t1)/2,t1][i];
      return '<text x="'+X(t).toFixed(1)+'" y="'+(H-3)+'" text-anchor="'+(i===0?"start":i===xts.length-1?"end":"middle")+'" font-size="7.5" fill="#566374" font-family="ui-monospace,monospace">'+lab+'</text>';}).join("");
    return '<div class="spark2"><svg viewBox="0 0 '+W+' '+H+'">'+refs+xt+
      '<polyline points="'+line+'" fill="none" stroke="'+color+'" stroke-width="1.5"/></svg></div>';
  };
  let charts="";
  const sp=h?.spark;
  if(sp && sp.length>=3){
    const P=k=>sp.map(p=>({t: p.t || new Date(p.d+"T12:00").getTime(), v: p[k]||0}));
    charts =
      '<div class="chartlbl">e1RM · peak '+Math.max(...sp.map(p=>p.e1))+'</div>'+
      lineSvg(P("e1"), "#6FD3E8");
    if(sp.some(p=>p.maxw>0))
      charts += '<div class="chartlbl">top weight of day · peak '+Math.max(...sp.map(p=>p.maxw||0))+'</div>'+
        lineSvg(P("maxw"), "#E88B4A");
    charts += '<div class="chartlbl">session volume (lb) · peak '+Math.max(...sp.map(p=>p.vol||0)).toLocaleString()+'</div>'+
      lineSvg(P("vol"), "#FFC93C");
  }
  const rows=(h?.recent||[]).map(s=>"<tr><td>"+s.d+"</td><td>"+
    s.sets.map(x=>(x[0]??"bw")+"×"+x[1]).join("  ")+"</td></tr>").join("");
  sh.innerHTML =
    '<h3>'+name+'</h3><div class="sub">'+new Date().toDateString()+'</div>'+
    '<div class="statrow">'+
      '<div class="stat"><div class="n">'+(h?.best?.e1||"—")+'</div><div class="l">best e1RM'+(h?.best?.d?' · '+h.best.d:'')+'</div></div>'+
      '<div class="stat"><div class="n">'+(todayBest||"—")+'</div><div class="l">today e1RM</div></div>'+
      '<div class="stat"><div class="n">'+(todayVol?todayVol.toLocaleString():"—")+'</div><div class="l">today vol</div></div>'+
      '<div class="stat"><div class="n">'+(tSets.length||"—")+'</div><div class="l">sets today</div></div>'+
    '</div>'+ charts +
    (rows?'<div class="chartlbl">all sessions ('+(h?.recent||[]).length+')</div><table class="sesstable">'+rows+'</table>':'<div class="sub">no history yet</div>');
  if(!sw2.classList.contains("on")){ sw2.classList.add("on"); uiOpen(); }
  if(!isRetry && session && navigator.onLine && (!h || Date.now()-h.at > 6*3600e3))
    fetchHist(name).then(()=>{ if(sw2.classList.contains("on")) openSheet(name, true); });
}

/* ---------- auth ---------- */
function authRow(){
  completeBar();
  const el=document.getElementById("authrow"); if(!el) return;
  const pend = local.filter(s=>!s.synced).length + dels.length + sessq.length;
  const coach=' · <a href="https://claude.ai/project/019f8da0-3f15-7083-9ac5-7d4738be6b9d" '+
    'style="color:var(--signal)" rel="noopener">coach</a>';
  if(session){
    el.innerHTML = "sync on · "+session.user.email+(pend?" · <b style='color:var(--sub)'>"+pend+" pending</b>":" · up to date")+
      ' · <a id="histlink">history</a>'+coach;
    el.querySelector("#histlink").onclick=openHist;
    return;
  }
  el.innerHTML = 'sync off'+(pend?' · '+pend+' sets waiting':'')+' · <a id="signin">sign in</a>'+coach;
  el.querySelector("#signin").onclick=()=>{
    el.innerHTML = '<input id="em" type="email" placeholder="email" value="kylelhk@gmail.com">'+
      '<button id="send">Send code</button>';
    el.querySelector("#send").onclick=async()=>{
      const email=el.querySelector("#em").value.trim();
      const {error}=await sb.auth.signInWithOtp({email,
        options:{shouldCreateUser:false, emailRedirectTo:"https://whosfromthegreatstate.github.io/training/"}});
      el.innerHTML = error ? "error — "+error.message
        : "link sent · open the email on this device and tap the sign-in link";
    };
  };
}

sb.auth.onAuthStateChange((_e,s)=>{ session=s; authRow(); if(s) sync(); });
window.addEventListener("online", sync);

window.WT = { decorate, opened, authRow, completeBar, uiOpen, uiClose };
render();
sync();
